# AI-assisted
[package]
name = "analog_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
analog_core = { path = "../core" }
bevy = { version = "0.14.2", default-features = false, features = [
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_winit",
  "multi_threaded",
  "png",
  "webgl2",
  "x11",
] }
bevy_egui = { version = "0.28.0", default-features = false, features = [
  "default_fonts",
  "open_url",
  "render",
] }
ehttp = "0.5"
png = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3.107"
uuid = { version = "1.29.2", features = ["js"] }
